plugins {
    id 'java-library'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation (
             'commons-codec:commons-codec:1.13',
            'org.junit.jupiter:junit-jupiter-engine:6.0.2',
            'io.rest-assured:rest-assured:6.0.0',
            "com.codeborne:selenide:7.14.0",
            "org.junit.platform:junit-platform-launcher:6.0.2"
    )
}



test {
    useJUnitPlatform()
}
